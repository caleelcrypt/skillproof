{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto glass-card p-8">
    <h2 class="text-3xl font-bold text-center mb-6">Login</h2>
    <form method="POST" action="/login">
        <input type="email" name="email" placeholder="Email" class="w-full border rounded-xl p-3 mb-4" required>
        <input type="password" name="password" placeholder="Password" class="w-full border rounded-xl p-3 mb-4" required>
        <button type="submit" class="w-full btn-primary text-white p-3 rounded-xl font-bold">Login</button>
    </form>
    <p class="mt-4 text-center text-sm text-slate-500">Demo: hr@techcorp.com / emp123</p>
    <p class="text-center text-sm mt-2"><a href="/signup" class="text-teal-600">Sign up as employer</a></p>
</div>
{% endblock %}
