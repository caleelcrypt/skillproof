{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto glass-card p-8">
    <h2 class="text-3xl font-bold text-center mb-6">Sign Up</h2>
    <form method="POST" action="/signup">
        <input type="text" name="name" placeholder="Full Name" class="w-full border rounded-xl p-3 mb-4" required>
        <input type="email" name="email" placeholder="Email" class="w-full border rounded-xl p-3 mb-4" required>
        <input type="password" name="password" placeholder="Password" class="w-full border rounded-xl p-3 mb-4" required>
        <button type="submit" class="w-full btn-primary text-white p-3 rounded-xl font-bold">Sign Up as Employer</button>
    </form>
    <p class="mt-4 text-center text-sm"><a href="/login" class="text-teal-600">Already have an account? Login</a></p>
</div>
{% endblock %}
