{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
        <div class="bg-slate-800 text-white p-4 flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold">{{ skill.name if skill else 'Skill' }} Assessment</h2>
                <p class="text-sm text-slate-300">{{ invitation.candidateName or 'Candidate' }}</p>
            </div>
            <div class="bg-black/40 px-4 py-2 rounded-full">
                <i class="far fa-clock mr-2"></i> <span id="timer">{{ time_limit }}:00</span>
            </div>
        </div>

        <form method="POST" action="/submit_test" id="testForm">
            <input type="hidden" name="token" value="{{ invitation.token }}">
            <div class="p-6 space-y-6 max-h-[70vh] overflow-y-auto">
                {% for q in questions %}
                <div class="border rounded-xl p-4">
                    <p class="font-bold text-slate-800 mb-2">Task {{ loop.index }} of {{ questions|length }}: {{ q.text }}</p>
                    <textarea name="answers[]" rows="4" class="code-editor w-full p-3" placeholder="Write your answer here..."></textarea>
                </div>
                {% endfor %}
            </div>
            <div class="p-6 border-t bg-gray-50 flex justify-end">
                <button type="submit" id="submitTestBtn" class="btn-primary text-white px-8 py-3 rounded-xl font-bold">
                    <i class="fas fa-paper-plane mr-2"></i> Submit Test
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Timer
    let timeLeft = {{ time_limit }} * 60;
    const timerDisplay = document.getElementById('timer');

    const interval = setInterval(() => {
        timeLeft--;
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timerDisplay.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        
        if (timeLeft <= 60) {
            timerDisplay.classList.add('text-red-500');
        }
        
        if (timeLeft <= 0) {
            clearInterval(interval);
            document.getElementById('testForm').submit();
        }
    }, 1000);

    // Confirm before submit
    document.getElementById('testForm').addEventListener('submit', function(e) {
        if (!confirm('Are you sure? You cannot retake the test.')) {
            e.preventDefault();
        }
    });
</script>
{% endblock %}
